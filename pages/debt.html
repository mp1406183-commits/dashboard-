<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debt · FD - Finance Dashboard</title>
<script>if(!localStorage.getItem('finance-current-profile-id')){ location.href = 'login.html'; }</script>
<link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

<div class="brand-stripe"></div>
<div class="shell">
  <div class="sidebar" id="sidebar">
    <div class="brand-row">
      <div class="brand"><span class="dot"></span>FD - FINANCE DASHBOARD</div>
      <div style="display:flex; align-items:center;">
        <div class="sync-status"><span class="pulse"></span>Saved locally</div>
        <div class="profile-badge" id="profileBadge"></div>
      </div>
    </div>
    <nav id="mainNav"></nav>
    <div class="sidebar-footer">
      <button id="resetBtn">Clear this profile's data</button>
      <button id="deleteProfileBtn">Delete this profile</button>
    </div>
  </div>

  <main class="content" id="mainContent">
    <div class="content-header" id="contentHeader">
      <div>
        <h1 id="pageTitle">Debt</h1>
        <div class="sub" id="dateSub"></div>
      </div>
      <button class="btn-primary" id="headerActionBtn">+ Add debt</button>
    </div>
    <div id="root">
      <div class="loading">Loading…</div>
    </div>
    <div class="page-footer"><span class="fmark">FD — Finance Dashboard</span> · your data stays private to this profile, in this browser</div>
  </main>
</div>

<script src="../scripts/app-data.js"></script>
<script src="../scripts/app-analytics.js"></script>
<script src="../scripts/app-shell.js"></script>
<script src="../scripts/debt.js"></script>
</body>
</html>
