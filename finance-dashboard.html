<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FD - Finance Dashboard</title>
<style>
  :root{
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface-alt: #FAF8F3;
    --border: #E6E1D6;
    --border-soft: #E6E1D6b0;
    --text: #1C1A16;
    --text-dim: #6B6558;
    --text-faint: #A39C8C;
    --glow: #0E6B5C;
    --glow-soft: #0E6B5C16;
    --income: #1B6B3D;
    --income-soft: #1B6B3D16;
    --expense: #93233F;
    --expense-soft: #93233F16;
    --invest: #5B3A8E;
    --invest-soft: #5B3A8E16;
    --gold: #AD8A3B;
    --gold-soft: #AD8A3B18;
    --mono: 'SF Mono', 'JetBrains Mono', 'Roboto Mono', Consolas, Monaco, monospace;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, #00000008 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button{ font-family: var(--sans); cursor: pointer; border: none; background: none; color: inherit; }
  input, select{ font-family: var(--sans); }
  ::selection{ background: var(--glow-soft); }

  .brand-stripe{ height: 3px; background: linear-gradient(90deg, var(--glow), var(--invest), var(--gold)); flex-shrink: 0; }

  /* ---------- Layout ---------- */
  .shell{ display:flex; flex-direction: column; min-height: 100vh; }

  .sidebar{
    width: 100%; border-bottom: 1px solid var(--border);
    display:flex; flex-direction: column;
    background: var(--surface);
  }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; gap: 16px; padding: 18px 28px 6px; flex-wrap: wrap; }
  .brand{ font-family: var(--mono); font-size: 14px; letter-spacing: 0.5px; display:flex; align-items:center; gap: 8px; }
  .brand .dot{ width:7px; height:7px; border-radius:50%; background: var(--glow); box-shadow: 0 0 6px var(--glow); flex-shrink:0; }
  .sidebar nav{ display:grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 8px; padding: 12px 28px 16px; }
  .sidebar nav button{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 6px;
    padding: 13px 8px; border-radius: 10px; font-size: 12px; color: var(--text-dim); text-align:center;
    border: 1px solid var(--border); background: var(--surface);
    box-shadow: 0 1px 2px rgba(28,26,22,0.04);
  }
  .sidebar nav button svg{ width:18px; height:18px; flex-shrink:0; opacity: 0.8; }
  .sidebar nav button:hover{ border-color: var(--glow); color: var(--text); }
  .sidebar nav button.active{ background: var(--glow-soft); color: var(--glow); border-color: var(--glow); box-shadow: 0 2px 8px rgba(13,148,136,0.14); }
  .sidebar nav button.active svg{ opacity:1; }
  .sidebar-footer{ padding: 2px 28px 16px; text-align: right; display:flex; justify-content:flex-end; gap: 18px; }
  #resetBtn{ color: var(--text-faint); font-size: 11.5px; padding: 4px 0; text-decoration: underline; }
  #resetBtn:hover{ color: var(--expense); }
  .profile-badge{ display:flex; align-items:center; gap: 9px; font-size: 12.5px; color: var(--text-dim); flex-shrink: 0; }
  .avatar{ width: 26px; height: 26px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-family: var(--mono); font-size: 11px; color: #ffffff; font-weight:700; flex-shrink: 0; }
  .profile-badge .pname{ color: var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 140px; }
  .profile-badge button{ color: var(--text-faint); font-size: 11.5px; text-decoration: underline; flex-shrink:0; }
  .profile-badge button:hover{ color: var(--text); }
  .sync-status{ display:flex; align-items:center; gap: 6px; font-size: 11px; color: var(--text-faint); margin-right: 4px; }
  .sync-status .pulse{ width:6px; height:6px; border-radius:50%; background: var(--income); box-shadow: 0 0 0 var(--income-soft); animation: pulse 2.2s infinite; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(21,128,61,0.35); }
    70%{ box-shadow: 0 0 0 6px rgba(21,128,61,0); }
    100%{ box-shadow: 0 0 0 0 rgba(21,128,61,0); }
  }
  .page-footer{ margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); text-align:center; color: var(--text-faint); font-size: 11px; }
  .page-footer .fmark{ font-family: var(--mono); letter-spacing: 0.4px; }

  .content{ padding: 24px 28px 60px; max-width: 1200px; margin: 0 auto; width: 100%; }
  .content-header{ display:flex; justify-content: space-between; align-items:flex-start; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
  .content-header h1{ font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 0 0 4px; letter-spacing: 0.1px; }
  .content-header .sub{ color: var(--text-dim); font-size: 12.5px; }


  /* ---------- Buttons ---------- */
  .btn-primary{ background: var(--glow); color: #06110E; padding: 9px 16px; border-radius: 6px; font-size: 13px; font-weight: 700; transition: box-shadow 0.15s; }
  .btn-primary:hover{ box-shadow: 0 0 16px var(--glow-soft); }
  .btn-ghost{ color: var(--text-dim); padding: 9px 14px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  .btn-ghost:hover{ border-color: var(--glow); color: var(--glow); }
  .btn-small{ color: var(--glow); border: 1px solid var(--glow); padding: 5px 10px; border-radius: 5px; font-size: 11.5px; }
  .btn-small:hover{ background: var(--glow-soft); }

  /* ---------- Stat cards ---------- */
  .stats{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card{ border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; background: var(--surface); box-shadow: 0 1px 2px rgba(28,26,22,0.05); transition: box-shadow 0.15s, transform 0.15s; }
  .stat-card:hover{ box-shadow: 0 4px 14px rgba(28,26,22,0.08); transform: translateY(-1px); }
  .stat-card .label{ color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
  .stat-card .value{ font-family: var(--mono); font-size: 21px; font-variant-numeric: tabular-nums; }
  .stat-card.income .value{ color: var(--income); }
  .stat-card.expense .value{ color: var(--expense); }
  .stat-card.glow .value{ color: var(--glow); }
  .stat-card.invest .value{ color: var(--invest); }
  .delta{ display:inline-flex; align-items:center; gap: 4px; font-family: var(--mono); font-size: 11px; margin-top: 8px; }
  .delta.up{ color: var(--expense); }
  .delta.down{ color: var(--income); }
  .delta.flat{ color: var(--text-faint); }

  .accounts-strip{ display:flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
  .account-chip{ border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; flex:1; min-width: 150px; background: var(--surface); box-shadow: 0 1px 2px rgba(28,26,22,0.05); }
  .account-chip .name{ font-size: 11.5px; color: var(--text-dim); margin-bottom: 6px; }
  .account-chip .bal{ font-family: var(--mono); font-size: 16px; }
  .account-chip .bal.neg{ color: var(--expense); }

  .mini-stats{ display:flex; gap: 20px; flex-wrap: wrap; }
  .mini-stat{ flex:1; min-width: 120px; }
  .mini-stat .label{ font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .mini-stat .value{ font-family: var(--mono); font-size: 16px; }

  /* ---------- Panels ---------- */
  .panels{ display:grid; grid-template-columns: 1.1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .panel{ border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; background: var(--surface); box-shadow: 0 1px 2px rgba(28,26,22,0.05); }
  .panel h2{ font-family: var(--serif); font-size: 15px; font-weight: 600; margin: 0 0 14px; }
  .panel-sub{ color: var(--text-faint); font-size: 11px; margin: -10px 0 14px; }
  .empty-note{ color: var(--text-faint); font-size: 12.5px; padding: 8px 0; }

  .donut-row{ display:flex; align-items:center; gap: 20px; }
  .donut{ width: 108px; height: 108px; border-radius: 50%; flex-shrink: 0; position: relative; }
  .donut::after{ content:''; position:absolute; inset: 18px; background: var(--surface); border-radius: 50%; }
  .legend{ flex:1; display:flex; flex-direction:column; gap: 7px; min-width: 0; }
  .legend-item{ display:flex; align-items:center; font-size: 12px; gap: 8px; }
  .legend-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .legend-cat{ color: var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .legend-amt{ color: var(--text-dim); font-family: var(--mono); font-size:11.5px; flex-shrink:0; }

  .budget-row{ margin-bottom: 13px; }
  .budget-row .top{ display:flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; gap: 10px; }
  .budget-row .amt{ color: var(--text-dim); font-family: var(--mono); font-size: 11.5px; }
  .budget-row .amt.over{ color: var(--expense); }
  .bar{ height: 5px; background: var(--surface-alt); border-radius: 3px; overflow:hidden; }
  .bar-fill{ height: 100%; background: var(--glow); border-radius: 3px; }
  .bar-fill.over{ background: var(--expense); }
  .bar-fill.gold{ background: var(--gold); }
  .add-budget{ display:flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }

  /* ---------- Sections ---------- */
  .section-box{ border: 1px solid var(--border); border-radius: 8px; padding: 20px 22px 10px; background: var(--surface); box-shadow: 0 1px 2px rgba(28,26,22,0.05); }
  .section-head{ display:flex; justify-content: space-between; align-items:center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .section-head h2{ font-family: var(--serif); font-size: 16px; font-weight: 600; margin:0; }
  .filters{ display:flex; gap: 8px; flex-wrap: wrap; }
  .filters input, .filters select, .add-budget select, .add-budget input{
    background: var(--surface-alt); border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 5px; font-size: 12px;
  }
  .filters input::placeholder{ color: var(--text-faint); }

  .form-panel{ background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; display:none; }
  .form-panel.open{ display:block; }
  .toggle-pills{ display:flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .pill{ padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text-dim); }
  .pill.active-income{ background: var(--income-soft); border-color: var(--income); color: var(--income); }
  .pill.active-expense{ background: var(--expense-soft); border-color: var(--expense); color: var(--expense); }
  .pill.active-saving{ background: var(--glow-soft); border-color: var(--glow); color: var(--glow); }
  .pill.active-investment{ background: var(--invest-soft); border-color: var(--invest); color: var(--invest); }
  .form-grid{ display:grid; grid-template-columns: 0.9fr 1.2fr 0.9fr 0.9fr 0.7fr auto; gap: 10px; align-items:end; }
  .form-grid.goal-grid{ grid-template-columns: 1.4fr 1fr auto; }
  .form-grid.account-grid{ grid-template-columns: 1.2fr 1fr 1fr auto; }
  .form-grid.sip-grid{ grid-template-columns: 1.2fr 1fr 0.9fr 1fr auto; }
  .form-grid.income-grid{ grid-template-columns: 1fr 1fr; }
  .field label{ display:block; font-size: 11px; color: var(--text-dim); margin-bottom: 5px; }
  .field input, .field select{ width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 5px; font-size: 12.5px; }

  /* ---------- Tables (still used for Income history) ---------- */
  table{ width: 100%; border-collapse: collapse; }
  thead th{ text-align: left; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing:0.4px; color: var(--text-faint); padding: 8px 4px; border-bottom: 1px solid var(--border); }
  thead th.num{ text-align: right; }
  tbody tr{ border-bottom: 1px solid var(--border-soft); }
  tbody tr:hover{ background: var(--surface-alt); }
  tbody tr:hover .del-btn{ opacity: 1; }
  tbody td{ padding: 11px 4px; font-size: 13px; vertical-align: middle; }
  td.date{ color: var(--text-dim); font-family: var(--mono); font-size: 11.5px; width: 84px; }
  td.cat{ color: var(--text-dim); font-size: 12px; }
  td.acct{ color: var(--text-faint); font-size: 11.5px; }
  td.amt{ text-align: right; font-family: var(--mono); font-size: 13px; width: 105px; }
  td.del{ width: 24px; text-align: center; }

  /* Shared transaction-type amount colors (table + line list) */
  .amt.income{ color: var(--income); }
  .amt.expense{ color: var(--expense); }
  .amt.saving{ color: var(--glow); }
  .amt.investment{ color: var(--invest); }

  .del-btn{ color: var(--text-faint); opacity: 0; font-size: 16px; line-height:1; }
  .del-btn:hover{ color: var(--expense); }

  /* ---------- Line-by-line transaction list ---------- */
  .txn-lines{ display:flex; flex-direction:column; }
  .txn-line{ display:flex; justify-content:space-between; align-items:center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--border-soft); }
  .txn-line:last-child{ border-bottom: none; }
  .txn-line:hover{ background: var(--surface-alt); }
  .txn-line:hover .del-btn{ opacity: 1; }
  .txn-main{ min-width: 0; flex: 1; }
  .txn-desc{ font-size: 13.5px; margin-bottom: 3px; overflow-wrap: anywhere; }
  .txn-meta{ font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
  .txn-right{ display:flex; align-items:center; gap: 12px; flex-shrink: 0; }
  .txn-right .amt{ font-family: var(--mono); font-size: 14px; }

  /* ---------- Goals / accounts / SIP rows ---------- */
  .goal-row, .account-row{ border-bottom: 1px solid var(--border-soft); padding: 16px 0; display:flex; align-items:center; gap: 18px; flex-wrap: wrap; }
  .goal-row:last-child, .account-row:last-child{ border-bottom: none; }
  .goal-main, .account-main{ flex: 1; min-width: 200px; }
  .goal-top, .account-top{ display:flex; justify-content:space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .goal-name, .account-name{ font-family: var(--serif); font-size: 15px; font-weight: 600; }
  .account-type{ display:inline-block; font-size: 10px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; margin-left: 8px; vertical-align: middle; }
  .goal-amt{ font-size: 12px; color: var(--text-dim); font-family: var(--mono); }
  .goal-amt .saved{ color: var(--gold); }
  .account-bal{ font-family: var(--mono); font-size: 15px; color: var(--text); }
  .account-bal.neg{ color: var(--expense); }
  .goal-actions, .account-actions{ display:flex; align-items:center; gap: 8px; flex-shrink:0; flex-wrap: wrap; }
  .goal-actions input, .goal-actions select{ width: 96px; background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 5px; font-size: 12px; }
  .goal-pct{ font-size: 10.5px; color: var(--text-faint); margin-top: 5px; font-family: var(--mono); }
  .goal-forecast{ font-size: 11px; color: var(--invest); margin-top: 4px; }

  .loading, .no-data{ color: var(--text-dim); padding: 40px 0; text-align:center; font-size: 13px; }

  /* ---------- Insights ---------- */
  .insight-list{ display:flex; flex-direction:column; gap: 10px; }
  .insight-item{ display:flex; gap: 10px; align-items:flex-start; border: 1px solid var(--border); border-radius: 7px; padding: 12px 14px; background: var(--surface-alt); font-size: 12.5px; line-height: 1.5; }
  .insight-item .tag{ flex-shrink:0; width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; }
  .tag.warn{ background: var(--expense); box-shadow: 0 0 6px var(--expense); }
  .tag.good{ background: var(--income); box-shadow: 0 0 6px var(--income); }
  .tag.info{ background: var(--invest); box-shadow: 0 0 6px var(--invest); }

  .chart-legend{ display:flex; gap: 18px; margin-bottom: 14px; font-size: 11.5px; color: var(--text-dim); flex-wrap: wrap; }
  .chart-legend span{ display:inline-flex; align-items:center; gap: 6px; }
  .chart-legend .sw{ width: 10px; height: 3px; border-radius: 2px; }

  /* ---------- Login screen ---------- */
  .login-shell{ display:flex; align-items:center; justify-content:center; min-height: 100vh; width:100%; }
  .login-wrap{ max-width: 380px; width: 100%; padding: 24px; }
  .login-wrap .brand-lg{ font-family: var(--mono); font-size: 16px; display:flex; align-items:center; gap: 9px; margin-bottom: 30px; }
  .login-wrap h2{ font-family: var(--serif); font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  .login-wrap .lede{ color: var(--text-dim); font-size: 12.5px; margin-bottom: 26px; }
  .profile-list{ display:flex; flex-direction:column; gap: 8px; margin-bottom: 20px; }
  .profile-item{ display:flex; align-items:center; gap: 12px; border: 1px solid var(--border); border-radius: 7px; padding: 12px 14px; background: var(--surface); }
  .profile-item:hover{ border-color: var(--glow); }
  .profile-item button.profile-select{ flex:1; display:flex; align-items:center; gap: 12px; text-align:left; min-width: 0; }
  .profile-item .avatar{ width: 32px; height:32px; font-size:12.5px; }
  .profile-name{ font-size: 13.5px; }
  .profile-remove{ color: var(--text-faint); font-size: 15px; padding: 4px; flex-shrink:0; }
  .profile-remove:hover{ color: var(--expense); }
  .pin-boxes{ display:flex; gap: 8px; margin: 16px 0 10px; }
  .pin-boxes input{ width: 42px; height: 48px; text-align:center; font-size: 19px; font-family: var(--mono); background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); border-radius: 6px; }
  .pin-boxes input:focus{ outline:none; border-color: var(--glow); box-shadow: 0 0 8px var(--glow-soft); }
  .login-error{ color: var(--expense); font-size: 12px; margin-bottom: 10px; min-height: 16px; }
  .login-note{ color: var(--text-faint); font-size: 11px; margin-top: 22px; line-height: 1.6; }
  .back-link{ color: var(--text-dim); font-size: 12px; margin-bottom: 16px; text-decoration: underline; }
  .create-form .field{ margin-bottom: 14px; }
  .login-toggle{ display:flex; border: 1px solid var(--border); border-radius: 7px; padding: 3px; margin-bottom: 24px; }
  .login-toggle .toggle-btn{ flex:1; padding: 8px 0; font-size: 12.5px; border-radius: 5px; color: var(--text-dim); }
  .login-toggle .toggle-btn.active{ background: var(--glow-soft); color: var(--glow); }

  @media (max-width: 860px){
    .brand-row{ padding: 16px 18px 4px; }
    .sidebar nav{ padding: 10px 18px 14px; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); }
    .sidebar-footer{ padding: 2px 18px 14px; }
    .content{ padding: 20px 18px 50px; }
    .panels{ grid-template-columns: 1fr; }
    .form-grid{ grid-template-columns: 1fr 1fr; }
    .goal-row, .account-row{ flex-direction: column; align-items: stretch; }
    .mini-stats{ flex-direction: column; gap: 12px; }
  }
</style>
</head>
<body>

<div class="brand-stripe"></div>
<div class="shell">
  <div class="sidebar" id="sidebar" style="display:none;">
    <div class="brand-row">
      <div class="brand"><span class="dot"></span>FD - FINANCE DASHBOARD</div>
      <div style="display:flex; align-items:center;">
        <div class="sync-status" id="syncStatus"><span class="pulse"></span>Synced</div>
        <div class="profile-badge" id="profileBadge"></div>
      </div>
    </div>
    <nav id="mainNav">
      <button data-tab="overview"></button>
      <button data-tab="income"></button>
      <button data-tab="transactions"></button>
      <button data-tab="savings"></button>
      <button data-tab="accounts"></button>
      <button data-tab="debt"></button>
      <button data-tab="insights"></button>
    </nav>
    <div class="sidebar-footer">
      <button id="resetBtn">Clear my data</button>
    </div>
  </div>

  <main class="content" id="mainContent">
    <div class="content-header" id="contentHeader" style="display:none;">
      <div>
        <h1 id="pageTitle">Overview</h1>
        <div class="sub" id="dateSub"></div>
      </div>
      <button class="btn-primary" id="headerActionBtn">+ Add entry</button>
    </div>
    <div id="root">
      <div class="loading">Booting platform…</div>
    </div>
    <div class="page-footer" id="mainFooter" style="display:none;"><span class="fmark">FD — Finance Dashboard</span> · your data stays private to this profile</div>
  </main>
</div>

<script>
(function(){
'use strict';

// ======================================================================
// Constants
// ======================================================================
// ======================================================================
// Supabase backend

function setSyncStatus(text, ok){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.innerHTML = `<span class="pulse"></span>${escapeHtml(text)}`;
  el.style.color = ok === false ? 'var(--expense)' : '';
}

async function sbRequest(path, options = {}, allowRefresh = true){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${accessToken || SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  if(res.status === 401 && allowRefresh && refreshToken){
    try{
      await refreshSession();
      return sbRequest(path, options, false);
    }catch(e){ /* fall through to normal error handling below */ }
  }
  if(!res.ok){
    const text = await res.text().catch(() => '');
    throw new Error(`Supabase ${res.status}: ${text}`);
  }
  if(res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
function sbSelect(table, columns, filter){
  let q = `${table}?select=${encodeURIComponent(columns)}`;
  if(filter) q += `&${filter}`;
  return sbRequest(q, { method: 'GET' });
}
function sbInsert(table, row){
  return sbRequest(table, { method: 'POST', body: JSON.stringify(row) });
}
function sbDelete(table, idCol, id){
  return sbRequest(`${table}?${idCol}=eq.${encodeURIComponent(id)}`, { method: 'DELETE' });
}
function sbUpsert(table, row, conflictCol){
  return sbRequest(`${table}?on_conflict=${conflictCol}`, {
    method: 'POST',
    headers: { 'Prefer': 'resolution=merge-duplicates' },
    body: JSON.stringify(row)
  });
}

async function refreshSession(){
  if(!refreshToken) throw new Error('No refresh token');
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: refreshToken })
  });
  if(!res.ok) throw new Error('Could not refresh session');
  const data = await res.json();
  accessToken = data.access_token;
  refreshToken = data.refresh_token;
  return data;
}

      body: JSON.stringify({ email, password })

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function fmt(n){
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtCompact(n){
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if(abs >= 1000) return sign + '$' + (abs/1000).toFixed(1) + 'k';
  return sign + '$' + abs.toFixed(0);
}

}
function monthLabel(){ return new Date().toLocaleDateString(undefined, { month:'long', year:'numeric' }); }
function parseLocalDate(dateStr){ return new Date(dateStr + 'T00:00:00'); }
function isThisMonth(dateStr){
  const d = parseLocalDate(dateStr); const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}
function isPrevMonth(dateStr){
  const d = parseLocalDate(dateStr); const now = new Date();
  const prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
  return d.getFullYear() === prev.getFullYear() && d.getMonth() === prev.getMonth();
}
function pctChange(curr, prev){
  if(prev === 0) return curr === 0 ? 0 : 100;
  return ((curr - prev) / Math.abs(prev)) * 100;
}
function initials(name){ return name.trim().split(/\s+/).slice(0,2).map(w => w[0].toUpperCase()).join(''); }
function colorFor(i){ return PALETTE[((i % PALETTE.length) + PALETTE.length) % PALETTE.length]; }
function colorForString(str){
  let h = 0;
  for(let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h);
  return colorFor(Math.abs(h));
}
function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

async function loadProfileData(){
  try{
    const rows = await sbSelect('finance_data', 'data', `profile_id=eq.${encodeURIComponent(currentUser.id)}`);
    const parsed = (rows && rows.length) ? rows[0].data : null;
    if(parsed){
      state = {
        transactions: parsed.transactions || [],
        budgets: parsed.budgets || [],
        goals: parsed.goals || [],
        accounts: parsed.accounts || [],
        sips: parsed.sips || [],
        debts: parsed.debts || []
      };
    }else{
      state = emptyState();
    }
  }catch(e){
    console.error('Failed to load profile data', e);
    state = emptyState();
    setSyncStatus('Offline — showing empty data', false);
  }

  // Seed sensible default accounts on first use, and backfill anything
  // saved before a field existed so older data keeps working.
  let needsSave = false;
  if(state.accounts.length === 0){
    state.accounts.push({ id: uid(), name: 'Cash', type: 'Cash', startingBalance: 0 });
    needsSave = true;
  }
  ['Bank','UPI'].forEach(name => {
    if(!state.accounts.some(a => a.name === name)){
      state.accounts.push({ id: uid(), name, type: name, startingBalance: 0 });
      needsSave = true;
    }
  });
  const defaultAccountId = state.accounts[0].id;
  state.transactions.forEach(t => {
    if(!t.accountId){ t.accountId = defaultAccountId; needsSave = true; }
  });

  activeTab = 'overview';
  filters = { search: '', type: 'all', category: 'all', account: 'all' };
  render();
  if(needsSave) await save();
}

async function save(){
  try{
    await sbUpsert('finance_data', { profile_id: currentUser.id, data: state, updated_at: new Date().toISOString() }, 'profile_id');
    setSyncStatus('Synced');
  }catch(e){
    console.error('Failed to save profile data', e);
    setSyncStatus('Not saved — retrying', false);
  }
}

async function addTransaction(t){
  state.transactions.unshift(t);
  if(t.type === 'saving' && t.goalId){
    const goal = state.goals.find(g => g.id === t.goalId);
    if(goal) goal.saved += t.amount;
  }
  render();
  await save();
}
async function deleteTransaction(id){
  const t = state.transactions.find(x => x.id === id);
  if(t && t.type === 'saving' && t.goalId){
    const goal = state.goals.find(g => g.id === t.goalId);
    if(goal) goal.saved = Math.max(0, goal.saved - t.amount);
  }
  state.transactions = state.transactions.filter(x => x.id !== id);
  render();
  await save();
}

async function deleteAccount(id){
  if(state.accounts.length === 1){ alert('You need at least one account. Add another before removing this one.'); return; }
  const linkedCount = state.transactions.filter(t => t.accountId === id).length;
  const msg = linkedCount > 0
    ? `This account has ${linkedCount} transaction${linkedCount === 1 ? '' : 's'}. Deleting it will unlink them — they'll stay in your history but won't count toward any account balance. Continue?`
    : 'Delete this account?';
  if(!confirm(msg)) return;
  state.transactions.forEach(t => { if(t.accountId === id) t.accountId = null; });
  state.accounts = state.accounts.filter(a => a.id !== id);
  render();
  await save();
}

// Standard amortization: months to pay off a balance at a fixed monthly payment
function payoffMonths(balance, apr, payment){
  if(balance <= 0) return 0;
  if(!payment || payment <= 0) return null;
  const r = (apr || 0) / 100 / 12;
  if(r === 0) return Math.ceil(balance / payment);
  if(payment <= balance * r) return null; // payment never covers interest — balance never shrinks
  const n = Math.log(payment / (payment - balance * r)) / Math.log(1 + r);
  return Math.ceil(n);
}
function debtPayoffInfo(d){
  const months = payoffMonths(d.balance, d.apr, d.minPayment);
  if(months === null) return { months: null };
  if(months === 0) return { months: 0, done: true };
  const totalPaid = d.minPayment * months;
  const totalInterest = Math.max(0, totalPaid - d.balance);
  const eta = new Date(); eta.setMonth(eta.getMonth() + months);
  return { months, totalInterest, etaLabel: eta.toLocaleDateString(undefined, { month:'short', year:'numeric' }) };
}

function computeStats(){
  const all = state.transactions;
  const balance = all.reduce((s,t) => t.type === 'income' ? s + t.amount : s - t.amount, 0);
  const thisMonth = all.filter(t => isThisMonth(t.date));
  const sumType = (type) => thisMonth.filter(t => t.type === type).reduce((s,t) => s + t.amount, 0);
  return {
    balance,
    income: sumType('income'),
    expense: sumType('expense'),
    saved: sumType('saving'),
    invested: sumType('investment')
  };
}
function computeDeltas(){
  const prevM = state.transactions.filter(t => isPrevMonth(t.date));
  const sumType = (type) => prevM.filter(t => t.type === type).reduce((s,t) => s + t.amount, 0);
  return {
    prevIncome: sumType('income'),
    prevExpense: sumType('expense'),
    prevSaved: sumType('saving'),
    prevInvested: sumType('investment')
  };
}
function computeCategoryBreakdown(type){
  const thisMonth = state.transactions.filter(t => t.type === type && isThisMonth(t.date));
  const byCat = {};
  thisMonth.forEach(t => { byCat[t.category] = (byCat[t.category] || 0) + t.amount; });
  const total = Object.values(byCat).reduce((a,b) => a+b, 0);
  const entries = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
  return { entries, total };
}
function computeMonthlyExpenseSummary(){
  const now = new Date();
  const daysElapsed = Math.max(1, now.getDate());
  const monthExpenses = state.transactions.filter(t => t.type === 'expense' && isThisMonth(t.date));
  const total = monthExpenses.reduce((s,t) => s + t.amount, 0);
  const largest = monthExpenses.reduce((m,t) => Math.max(m, t.amount), 0);
  return { total, count: monthExpenses.length, dailyAvg: total / daysElapsed, largest };
}
function donutGradient(entries, total){
  if(total === 0) return 'conic-gradient(var(--surface-alt) 0 100%)';
  let acc = 0;
  const parts = entries.map((e,i) => {
    const pct = e[1]/total*100; const start = acc; acc += pct;
    return `${colorFor(i)} ${start}% ${acc}%`;
  });
  return `conic-gradient(${parts.join(',')})`;
}
function last6Months(){
  const out = []; const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push({ y: d.getFullYear(), m: d.getMonth(), label: d.toLocaleDateString(undefined,{month:'short'}) });
  }
  return out;
}
function monthlySeries(){
  const months = last6Months();
  const sumFor = (type, mo) => state.transactions
    .filter(t => t.type === type)
    .filter(t => { const d = parseLocalDate(t.date); return d.getFullYear() === mo.y && d.getMonth() === mo.m; })
    .reduce((s,t) => s + t.amount, 0);
  return {
    months,
    income: months.map(mo => sumFor('income', mo)),
    expense: months.map(mo => sumFor('expense', mo)),
    investment: months.map(mo => sumFor('investment', mo))
  };
}
function buildTrendChart(months, incomeArr, expenseArr, investArr){
  const W = 640, H = 200, padL = 42, padB = 26, padT = 14, padR = 14;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxVal = Math.max(1, ...incomeArr, ...expenseArr, ...investArr);
  const n = Math.max(1, months.length - 1);
  const x = i => padL + (i/n) * innerW;
  const y = v => padT + innerH - (v/maxVal) * innerH;
  const path = arr => arr.map((v,i) => `${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const gridLines = [0,0.25,0.5,0.75,1].map(f => {
    const yy = padT + innerH*(1-f);
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--border)" stroke-width="1"/>
            <text x="${padL-8}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--text-faint)" font-family="var(--mono)">${fmtCompact(maxVal*f)}</text>`;
  }).join('');
  const xLabels = months.map((mo,i) => `<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--text-faint)">${mo.label}</text>`).join('');
  const dots = (arr,color) => arr.map((v,i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${color}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
    ${gridLines}
    <path d="${path(expenseArr)}" fill="none" stroke="var(--expense)" stroke-width="2"/>
    <path d="${path(incomeArr)}" fill="none" stroke="var(--income)" stroke-width="2"/>
    <path d="${path(investArr)}" fill="none" stroke="var(--invest)" stroke-width="2" stroke-dasharray="4 3"/>
    ${dots(expenseArr,'var(--expense)')}${dots(incomeArr,'var(--income)')}${dots(investArr,'var(--invest)')}
    ${xLabels}
  </svg>`;
}
function totalStartingBalance(){
  return state.accounts.reduce((s,a) => s + (a.startingBalance || 0), 0);
}
// Only income/expense change total net worth — saving and investment are internal
// transfers between buckets (cash -> goal/investment), not a change in what you own.
function cumulativeNetCashflow(uptoDate){
  return state.transactions
    .filter(t => t.type === 'income' || t.type === 'expense')
    .filter(t => !uptoDate || parseLocalDate(t.date) <= uptoDate)
    .reduce((s,t) => s + (t.type === 'income' ? t.amount : -t.amount), 0);
}
function netWorthToday(){
  return totalStartingBalance() + cumulativeNetCashflow() - totalDebt();
}
function netWorthSeries(){
  const months = last6Months();
  const base = totalStartingBalance();
  const values = months.map(mo => {
    const endOfMonth = new Date(mo.y, mo.m + 1, 0);
    return base + cumulativeNetCashflow(endOfMonth);
  });
  return { months, values };
}
function buildAreaChart(months, values, color){
  const W = 640, H = 160, padL = 46, padB = 24, padT = 14, padR = 14;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const minVal = Math.min(0, ...values);
  const maxVal = Math.max(1, ...values);
  const range = (maxVal - minVal) || 1;
  const n = Math.max(1, months.length - 1);
  const x = i => padL + (i/n) * innerW;
  const y = v => padT + innerH - ((v - minVal)/range) * innerH;
  const linePath = values.map((v,i) => `${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L ${x(values.length-1).toFixed(1)} ${y(minVal).toFixed(1)} L ${x(0).toFixed(1)} ${y(minVal).toFixed(1)} Z`;
  const gridLines = [0,0.5,1].map(f => {
    const yy = padT + innerH*(1-f);
    const val = minVal + range*f;
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--border)" stroke-width="1"/>
            <text x="${padL-8}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--text-faint)" font-family="var(--mono)">${fmtCompact(val)}</text>`;
  }).join('');
  const xLabels = months.map((mo,i) => `<text x="${x(i)}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--text-faint)">${mo.label}</text>`).join('');
  const dots = values.map((v,i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${color}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;">
    ${gridLines}
    <path d="${areaPath}" fill="${color}" opacity="0.12" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}
    ${xLabels}
  </svg>`;
}
function goalForecast(goal){
  const contributions = state.transactions.filter(t => t.type === 'saving' && t.goalId === goal.id);
  if(contributions.length === 0) return null;
  const dates = contributions.map(c => parseLocalDate(c.date).getTime());
  const earliest = new Date(Math.min(...dates));
  const now = new Date();
  const monthsElapsed = Math.max(1, (now.getFullYear()-earliest.getFullYear())*12 + (now.getMonth()-earliest.getMonth()) + 1);
  const totalContributed = contributions.reduce((s,c) => s+c.amount, 0);
  const avgMonthly = totalContributed / monthsElapsed;
  const remaining = goal.target - goal.saved;
  if(remaining <= 0) return { done: true };
  if(avgMonthly <= 0) return null;
  const monthsNeeded = Math.ceil(remaining/avgMonthly);
  const eta = new Date(now.getFullYear(), now.getMonth()+monthsNeeded, 1);
  return { monthsNeeded, etaLabel: eta.toLocaleDateString(undefined,{month:'short',year:'numeric'}), avgMonthly };
}
function buildInsights(){
  const insights = [];
  const { income, expense, saved, invested } = computeStats();
  const { prevExpense } = computeDeltas();
  const { entries: catEntries, total: catTotal } = computeCategoryBreakdown('expense');

  if(catTotal > 0){
    const top = catEntries[0];
    insights.push({ tag:'info', text: `${top[0]} is your top expense category this month at ${fmt(top[1])} (${((top[1]/catTotal)*100).toFixed(0)}% of spend).` });
  }
  if(prevExpense > 0){
    const pct = pctChange(expense, prevExpense);
    if(Math.abs(pct) >= 5){
      insights.push({ tag: pct > 0 ? 'warn' : 'good', text: `Expenses are ${pct > 0 ? 'up' : 'down'} ${Math.abs(pct).toFixed(0)}% vs last month (${fmt(expense)} vs ${fmt(prevExpense)}).` });
    }
  }
  if(income > 0){
    const rate = (saved/income)*100;
    insights.push({ tag: rate >= 15 ? 'good' : 'info', text: `You're saving ${rate.toFixed(0)}% of this month's income.` });
  }
  if(invested > 0){
    insights.push({ tag:'info', text: `You invested ${fmt(invested)} this month.` });
  }
  state.budgets.forEach(b => {
    const spent = state.transactions.filter(t => t.type === 'expense' && t.category === b.category && isThisMonth(t.date)).reduce((s,t) => s+t.amount, 0);
    if(spent > b.limit) insights.push({ tag:'warn', text: `${b.category} budget is over by ${fmt(spent-b.limit)} this month.` });
  });
  state.goals.forEach(g => {
    const f = goalForecast(g);
    const safeName = escapeHtml(g.name);
    if(f && f.done) insights.push({ tag:'good', text: `"${safeName}" is fully funded.` });
    else if(f) insights.push({ tag:'info', text: `At current pace, "${safeName}" reaches its goal around ${f.etaLabel} (~${fmt(f.avgMonthly)}/mo).` });
  });
  if(insights.length === 0) insights.push({ tag:'info', text: 'Add a few transactions and this panel will start surfacing trends automatically.' });
  return insights;
}

function deltaHtml(curr, prev, invert){
  if(prev === 0 && curr === 0) return '';
  const pct = pctChange(curr, prev);
  const rising = pct > 0;
  const cls = pct === 0 ? 'flat' : (invert ? (rising ? 'down' : 'up') : (rising ? 'up' : 'down'));
  const arrow = pct === 0 ? '→' : (rising ? '↑' : '↓');
  return `<div class="delta ${cls}">${arrow} ${Math.abs(pct).toFixed(0)}% vs last mo.</div>`;
}

      ${state.sips.length === 0 ? `<div class="empty-note">No SIPs yet. Set one up to track a recurring mutual fund investment.</div>` : state.sips.map(s => {
        const { total, count } = sipTotals(s);
        return `
          <div class="goal-row">
            <div class="goal-main">
              <div class="goal-top">
                <span class="goal-name">${escapeHtml(s.name)}<span class="account-type">${escapeHtml(s.fundType)}</span></span>
                <span class="goal-amt"><span class="saved">${fmt(total)}</span> invested</span>
              </div>
              <div class="goal-pct">${fmt(s.monthlyAmount)}/mo · ${count} installment${count === 1 ? '' : 's'} logged · via ${escapeHtml(accountName(s.accountId))}</div>
            </div>
            <div class="goal-actions">
              <button class="btn-small sipLogBtn" data-sip="${s.id}">Log this month</button>
              <button class="del-btn sipDelBtn" data-sip="${s.id}" style="opacity:1">×</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderAccounts(){
  const total = state.accounts.reduce((s,a) => s + accountBalance(a), 0);
  return `
    <div class="stats" style="grid-template-columns: 1fr 1fr;">
      <div class="stat-card"><div class="label">Combined balance</div><div class="value">${fmt(total)}</div></div>
      <div class="stat-card"><div class="label">Accounts</div><div class="value">${state.accounts.length}</div></div>
    </div>
    <div class="section-box">
      <div class="section-head"><h2>Bank accounts</h2></div>
      <div class="form-panel ${accountFormOpen ? 'open' : ''}" id="accountFormPanel">
        <div class="form-grid account-grid">
          <div class="field"><label>Account name</label><input type="text" id="aName" placeholder="e.g. Chase Checking"></div>
          <div class="field"><label>Type</label><select id="aType">${ACCOUNT_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}</select></div>
          <div class="field"><label>Starting balance</label><input type="number" id="aBalance" placeholder="0.00" step="0.01"></div>
          <button class="btn-primary" id="submitAccountBtn">Create</button>
        </div>
      </div>
      ${state.accounts.map(a => {
        const bal = accountBalance(a);
        const count = state.transactions.filter(t => t.accountId === a.id).length;
        return `
          <div class="account-row">
            <div class="account-main">
              <div class="account-top"><span class="account-name">${escapeHtml(a.name)}<span class="account-type">${escapeHtml(a.type)}</span></span></div>
              <div class="goal-pct">${count} transaction${count === 1 ? '' : 's'}${a.startingBalance ? ' · starting balance ' + fmt(a.startingBalance) : ''}</div>
            </div>
            <div class="account-actions">
              <span class="account-bal ${bal < 0 ? 'neg' : ''}">${fmt(bal)}</span>
              <button class="del-btn accountDelBtn" data-account="${a.id}" style="opacity:1">×</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderDebt(){
  const total = totalDebt();
  const totalMin = state.debts.reduce((s,d) => s + d.minPayment, 0);
  return `
    <div class="stats" style="grid-template-columns: 1fr 1fr;">
      <div class="stat-card expense"><div class="label">Total debt</div><div class="value">${fmt(total)}</div></div>
      <div class="stat-card"><div class="label">Monthly minimums</div><div class="value">${fmt(totalMin)}</div></div>
    </div>
    <div class="section-box">
      <div class="section-head"><h2>Debts</h2></div>
      <div class="panel-sub">Track loans and credit card balances — see the real payoff date and total interest at your current payment.</div>
      <div class="form-panel ${debtFormOpen ? 'open' : ''}" id="debtFormPanel">
        <div class="form-grid" style="grid-template-columns: 1.2fr 0.9fr 0.7fr 0.9fr auto;">
          <div class="field"><label>Debt name</label><input type="text" id="dName" placeholder="e.g. Visa Credit Card"></div>
          <div class="field"><label>Current balance</label><input type="number" id="dBalance" placeholder="0.00" min="0" step="0.01"></div>
          <div class="field"><label>APR %</label><input type="number" id="dApr" placeholder="e.g. 22.9" min="0" step="0.1"></div>
          <div class="field"><label>Monthly payment</label><input type="number" id="dPayment" placeholder="0.00" min="0" step="1"></div>
          <button class="btn-primary" id="submitDebtBtn">Add</button>
        </div>
      </div>
      ${state.debts.length === 0 ? `<div class="empty-note">No debts tracked. Add a credit card or loan above to see its real payoff date.</div>` : state.debts.map(d => {
        const info = debtPayoffInfo(d);
        let payoffLine;
        if(d.balance <= 0) payoffLine = `<div class="goal-forecast">✓ Paid off</div>`;
        else if(info.months === null) payoffLine = `<div class="goal-forecast" style="color:var(--expense)">At this payment, the balance will never shrink — interest exceeds the payment.</div>`;
        else payoffLine = `<div class="goal-forecast">Paid off in ${info.months} mo. (~${info.etaLabel}) · ~${fmt(info.totalInterest)} interest total</div>`;
        return `
          <div class="goal-row">
            <div class="goal-main">
              <div class="goal-top">
                <span class="goal-name">${escapeHtml(d.name)}<span class="account-type">${d.apr}% APR</span></span>
                <span class="goal-amt"><span class="saved" style="color:var(--expense)">${fmt(d.balance)}</span> owed</span>
              </div>
              <div class="goal-pct">${fmt(d.minPayment)}/mo payment</div>
              ${payoffLine}
            </div>
            <div class="goal-actions">
              <select class="debtPayAccount" data-debt="${d.id}">${accountOptions()}</select>
              <input type="number" placeholder="Amount" min="0" step="1" class="debtPayInput" data-debt="${d.id}">
              <button class="btn-small debtPayBtn" data-debt="${d.id}">Pay</button>
              <button class="del-btn debtDelBtn" data-debt="${d.id}" style="opacity:1">×</button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderInsights(){
  const { months, income, expense, investment } = monthlySeries();
  const insights = buildInsights();
  const { months: nwMonths, values: nwValues } = netWorthSeries();
  return `
    <div class="panel" style="margin-bottom:20px;">
      <h2>Net worth trend — last 6 months</h2>
      <div class="panel-sub">Cash + savings + investments, minus today's total debt. Only income and expenses move this line — saving and investing just shift money between buckets you still own.</div>
      ${buildAreaChart(nwMonths, nwValues, 'var(--glow)')}
      <div class="mini-stats" style="margin-top:10px;">
        <div class="mini-stat"><div class="label">Net worth today</div><div class="value">${fmt(netWorthToday())}</div></div>
        <div class="mini-stat"><div class="label">Total debt</div><div class="value" style="color:var(--expense)">${fmt(totalDebt())}</div></div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:20px;">
      <h2>Income vs. expenses vs. investing — last 6 months</h2>
      <div class="chart-legend">
        <span><span class="sw" style="background:var(--income)"></span>Income</span>
        <span><span class="sw" style="background:var(--expense)"></span>Expenses</span>
        <span><span class="sw" style="background:var(--invest)"></span>Investment</span>
      </div>
      ${buildTrendChart(months, income, expense, investment)}
    </div>
    <div class="panel">
      <h2>Auto insights</h2>
      <div class="panel-sub">Generated from your current data — updates as you log more.</div>
      <div class="insight-list">${insights.map(i => `<div class="insight-item"><span class="tag ${i.tag}"></span><span>${i.text}</span></div>`).join('')}</div>
    </div>
  `;
}

// ======================================================================
// Rendering — login screen
// ======================================================================
function loginToggleBar(){
  return `<div class="login-toggle">
    <button class="toggle-btn ${authMode === 'signin' ? 'active' : ''}" id="toSigninTab">Log In</button>
    <button class="toggle-btn ${authMode === 'signup' ? 'active' : ''}" id="toSignupTab">Sign Up</button>
  </div>`;
}

function renderLogin(){
  const brand = `<div class="brand-lg"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow);display:inline-block;"></span>FD - FINANCE DASHBOARD</div>`;

  if(authMode === 'signup'){
    return `<div class="login-shell"><div class="login-wrap">
      ${brand}
      ${loginToggleBar()}
      <h2>Create your account</h2>
      <div class="lede">Sign up with your email — your data syncs to any device you log into.</div>
      <div class="create-form">
        <div class="field"><label>Name</label><input type="text" id="suName" placeholder="e.g. Alex"></div>
        <div class="field"><label>Email</label><input type="email" id="suEmail" placeholder="you@example.com"></div>
        <div class="field"><label>Password</label><input type="password" id="suPassword" placeholder="At least 6 characters"></div>
        <div class="login-error">${escapeHtml(authError)}</div>
        <button class="btn-primary" id="signupBtn">Create account</button>
      </div>
      <div class="login-note">Your password is handled by Supabase's auth system, not stored with your finance data. Depending on this project's settings you may need to confirm your email before you can log in.</div>
    </div></div>`;
  }

  return `<div class="login-shell"><div class="login-wrap">
    ${brand}
    ${loginToggleBar()}
    <h2>Log in</h2>
    <div class="lede">Use the email and password you signed up with.</div>
    <div class="create-form">
      <div class="field"><label>Email</label><input type="email" id="siEmail" placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input type="password" id="siPassword" placeholder="Your password"></div>
      <div class="login-error">${escapeHtml(authError)}</div>
      <button class="btn-primary" id="signinBtn">Log in</button>
    </div>
  </div></div>`;
}

// ======================================================================
// Master render + event wiring
// ======================================================================
function render(){
  const sidebar = document.getElementById('sidebar');
  const contentHeader = document.getElementById('contentHeader');
  const mainFooter = document.getElementById('mainFooter');

  if(!currentUser){
    sidebar.style.display = 'none';
    contentHeader.style.display = 'none';
    mainFooter.style.display = 'none';
    root.innerHTML = renderLogin();
    attachLoginHandlers();
    return;
  }

  sidebar.style.display = 'flex';
  contentHeader.style.display = 'flex';
  mainFooter.style.display = 'block';

  document.querySelectorAll('#mainNav button').forEach(btn => {
    const tab = btn.dataset.tab;
    btn.classList.toggle('active', tab === activeTab);
    btn.innerHTML = svgIcon(tab) + TAB_LABELS[tab];
    btn.onclick = () => { activeTab = tab; render(); };
  });

  const badge = document.getElementById('profileBadge');
  badge.innerHTML = `<span class="avatar" style="background:${colorForString(currentUser.email)}">${initials(currentUser.name)}</span><span class="pname">${escapeHtml(currentUser.name)}</span><button id="switchProfileBtn">Log out</button>`;
  document.getElementById('switchProfileBtn').onclick = signOut;

  document.getElementById('pageTitle').textContent = TAB_LABELS[activeTab];
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const firstName = currentUser.name.trim().split(/\s+/)[0];
  const dateStr = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  document.getElementById('dateSub').textContent = firstName ? `${greeting}, ${firstName} · ${dateStr}` : dateStr;

  const headerLabels = { overview: '+ Add entry', income: '+ Add income', transactions: '+ Add entry', savings: '+ New goal', accounts: '+ New account', debt: '+ Add debt', insights: null };
  const actionBtn = document.getElementById('headerActionBtn');
  if(headerLabels[activeTab]){ actionBtn.style.display = 'inline-block'; actionBtn.textContent = headerLabels[activeTab]; }
  else{ actionBtn.style.display = 'none'; }

  if(activeTab === 'overview') root.innerHTML = renderOverview();
  else if(activeTab === 'income') root.innerHTML = renderIncome();
  else if(activeTab === 'transactions') root.innerHTML = renderTransactions();
  else if(activeTab === 'savings') root.innerHTML = renderSavings();
  else if(activeTab === 'accounts') root.innerHTML = renderAccounts();
  else if(activeTab === 'debt') root.innerHTML = renderDebt();
  else root.innerHTML = renderInsights();

  attachHandlers();
}

function attachLoginHandlers(){
  const toSignin = document.getElementById('toSigninTab');
  const toSignup = document.getElementById('toSignupTab');
  if(toSignin) toSignin.onclick = () => { authMode = 'signin'; authError = ''; render(); };
  if(toSignup) toSignup.onclick = () => { authMode = 'signup'; authError = ''; render(); };

  if(authMode === 'signin'){
    const goSignin = () => {
      const email = document.getElementById('siEmail').value.trim();
      const password = document.getElementById('siPassword').value;
      if(!email || !password){ authError = 'Enter your email and password.'; render(); return; }
      signIn(email, password);
    };
    document.getElementById('signinBtn').onclick = goSignin;
    document.getElementById('siPassword').onkeydown = (e) => { if(e.key === 'Enter') goSignin(); };
  }else{
    const goSignup = () => {
      const name = document.getElementById('suName').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      const password = document.getElementById('suPassword').value;
      if(!name){ authError = 'Enter your name.'; render(); return; }
      if(!email || !password){ authError = 'Enter an email and password.'; render(); return; }
      if(password.length < 6){ authError = 'Password must be at least 6 characters.'; render(); return; }
      signUp(name, email, password);
    };
    document.getElementById('signupBtn').onclick = goSignup;
    document.getElementById('suPassword').onkeydown = (e) => { if(e.key === 'Enter') goSignup(); };
  }
}

function openAddEntry(){
  addOpen = true;
  const panel = document.getElementById('addEntryPanel');
  if(panel) panel.classList.add('open');
}

function attachHandlers(){
  if(activeTab === 'overview'){
    document.getElementById('saveBudgetBtn').onclick = () => {
      const category = document.getElementById('budgetCat').value;
      const limit = parseFloat(document.getElementById('budgetLimit').value);
      if(!limit || limit <= 0){ alert('Enter a valid monthly limit.'); return; }
      addBudget(category, limit);
    };
  }

  if(activeTab === 'income'){
    const qiCategorySelect = document.getElementById('qiCategory');
    const qiCategoryOtherInput = document.getElementById('qiCategoryOther');
    const toggleQiOther = () => { qiCategoryOtherInput.style.display = qiCategorySelect.value === 'Other' ? 'block' : 'none'; };
    qiCategorySelect.onchange = toggleQiOther;
    toggleQiOther();
    document.getElementById('qiSubmit').onclick = () => {
      const note = document.getElementById('qiNote').value.trim();
      let category = document.getElementById('qiCategory').value;
      if(category === 'Other'){
        const custom = document.getElementById('qiCategoryOther').value.trim();
        if(custom) category = custom;
      }
      const accountId = document.getElementById('qiAccount').value;
      const amount = parseFloat(document.getElementById('qiAmount').value);
      if(!amount || amount <= 0){ alert('Enter a valid amount.'); return; }
      addTransaction({ id: uid(), type: 'income', date: new Date().toISOString().slice(0,10), note, category, amount, accountId, goalId: null });
    };
    document.querySelectorAll('.del-btn[data-id]').forEach(btn => { btn.onclick = () => deleteTransaction(btn.dataset.id); });
  }

  if(activeTab === 'transactions'){
    document.getElementById('searchInput').oninput = (e) => { filters.search = e.target.value; render(); };
    document.getElementById('typeFilter').onchange = (e) => { filters.type = e.target.value; filters.category = 'all'; render(); };
    document.getElementById('catFilter').onchange = (e) => { filters.category = e.target.value; render(); };
    document.getElementById('acctFilter').onchange = (e) => { filters.account = e.target.value; render(); };
    document.getElementById('directionFilter').onchange = (e) => { filters.direction = e.target.value; render(); };
    document.getElementById('pillIncome').onclick = () => { entryType = 'income'; render(); openAddEntry(); };
    document.getElementById('pillExpense').onclick = () => { entryType = 'expense'; render(); openAddEntry(); };
    document.getElementById('pillSaving').onclick = () => { entryType = 'saving'; render(); openAddEntry(); };
    document.getElementById('pillInvestment').onclick = () => { entryType = 'investment'; render(); openAddEntry(); };
    const fCategorySelect = document.getElementById('fCategory');
    const fCategoryOtherInput = document.getElementById('fCategoryOther');
    const toggleFOther = () => { fCategoryOtherInput.style.display = fCategorySelect.value === 'Other' ? 'block' : 'none'; };
    fCategorySelect.onchange = toggleFOther;
    toggleFOther();
    document.getElementById('submitEntryBtn').onclick = () => {
      const date = document.getElementById('fDate').value;
      const note = document.getElementById('fNote').value.trim();
      let category = document.getElementById('fCategory').value;
      if(category === 'Other'){
        const custom = document.getElementById('fCategoryOther').value.trim();
        if(custom) category = custom;
      }
      const accountId = document.getElementById('fAccount').value;
      const amount = parseFloat(document.getElementById('fAmount').value);
      if(!date || !amount || amount <= 0){ alert('Please enter a valid date and amount.'); return; }
      const goal = entryType === 'saving' ? state.goals.find(g => g.name === category) : null;
      addTransaction({ id: uid(), type: entryType, date, note, category, amount, accountId, goalId: goal ? goal.id : null });
      addOpen = false;
    };
    document.querySelectorAll('.del-btn[data-id]').forEach(btn => { btn.onclick = () => deleteTransaction(btn.dataset.id); });
  }

  if(activeTab === 'savings'){
    document.getElementById('submitGoalBtn').onclick = () => {
      const name = document.getElementById('gName').value.trim();
      const target = parseFloat(document.getElementById('gTarget').value);
      if(!name || !target || target <= 0){ alert('Enter a goal name and a valid target amount.'); return; }
      addGoal(name, target);
      goalFormOpen = false;
    };
    document.querySelectorAll('.contribBtn').forEach(btn => {
      btn.onclick = () => {
        const goalId = btn.dataset.goal;
        const input = document.querySelector(`.contribInput[data-goal="${goalId}"]`);
        const accountSelect = document.querySelector(`.contribAccount[data-goal="${goalId}"]`);
        const amount = parseFloat(input.value);
        if(!amount || amount <= 0){ alert('Enter a valid contribution amount.'); return; }
        contributeToGoal(goalId, amount, accountSelect.value);
      };
    });
    document.querySelectorAll('.goalDelBtn').forEach(btn => { btn.onclick = () => deleteGoal(btn.dataset.goal); });

    document.getElementById('toggleSipFormBtn').onclick = () => {
      sipFormOpen = !sipFormOpen;
      document.getElementById('sipFormPanel').classList.toggle('open', sipFormOpen);
    };
    document.getElementById('submitSipBtn').onclick = () => {
      const name = document.getElementById('sName').value.trim();
      const fundType = document.getElementById('sFundType').value;
      const monthlyAmount = parseFloat(document.getElementById('sAmount').value);
      const accountId = document.getElementById('sAccount').value;
      if(!name || !monthlyAmount || monthlyAmount <= 0){ alert('Enter a plan name and a valid monthly amount.'); return; }
      addSIP(name, fundType, monthlyAmount, accountId);
      sipFormOpen = false;
    };
    document.querySelectorAll('.sipLogBtn').forEach(btn => { btn.onclick = () => logSIPContribution(btn.dataset.sip); });
    document.querySelectorAll('.sipDelBtn').forEach(btn => { btn.onclick = () => deleteSIP(btn.dataset.sip); });
  }

  if(activeTab === 'accounts'){
    document.getElementById('submitAccountBtn').onclick = () => {
      const name = document.getElementById('aName').value.trim();
      const type = document.getElementById('aType').value;
      const startingBalance = parseFloat(document.getElementById('aBalance').value) || 0;
      if(!name){ alert('Enter an account name.'); return; }
      addAccount(name, type, startingBalance);
      accountFormOpen = false;
    };
    document.querySelectorAll('.accountDelBtn').forEach(btn => { btn.onclick = () => deleteAccount(btn.dataset.account); });
  }

  if(activeTab === 'debt'){
    document.getElementById('submitDebtBtn').onclick = () => {
      const name = document.getElementById('dName').value.trim();
      const balance = parseFloat(document.getElementById('dBalance').value);
      const apr = parseFloat(document.getElementById('dApr').value) || 0;
      const minPayment = parseFloat(document.getElementById('dPayment').value);
      if(!name || isNaN(balance) || balance < 0){ alert('Enter a debt name and a valid balance.'); return; }
      if(!minPayment || minPayment <= 0){ alert('Enter a valid monthly payment.'); return; }
      addDebt(name, balance, apr, minPayment);
      debtFormOpen = false;
    };
    document.querySelectorAll('.debtPayBtn').forEach(btn => {
      btn.onclick = () => {
        const debtId = btn.dataset.debt;
        const input = document.querySelector(`.debtPayInput[data-debt="${debtId}"]`);
        const accountSelect = document.querySelector(`.debtPayAccount[data-debt="${debtId}"]`);
        const amount = parseFloat(input.value);
        if(!amount || amount <= 0){ alert('Enter a valid payment amount.'); return; }
        makeDebtPayment(debtId, amount, accountSelect.value);
      };
    });
    document.querySelectorAll('.debtDelBtn').forEach(btn => { btn.onclick = () => deleteDebt(btn.dataset.debt); });
  }
}

// ======================================================================
// Boot
// ======================================================================
document.getElementById('headerActionBtn').onclick = () => {
  if(activeTab === 'savings'){
    goalFormOpen = !goalFormOpen;
    document.getElementById('goalFormPanel').classList.toggle('open', goalFormOpen);
  }else if(activeTab === 'accounts'){
    accountFormOpen = !accountFormOpen;
    document.getElementById('accountFormPanel').classList.toggle('open', accountFormOpen);
  }else if(activeTab === 'debt'){
    debtFormOpen = !debtFormOpen;
    document.getElementById('debtFormPanel').classList.toggle('open', debtFormOpen);
  }else if(activeTab === 'income'){
    const el = document.getElementById('qiNote');
    if(el) el.focus();
  }else{
    entryType = activeTab === 'income' ? 'income' : (entryType || 'expense');
    if(activeTab !== 'transactions'){ activeTab = 'transactions'; render(); }
    addOpen = !addOpen;
    const panel = document.getElementById('addEntryPanel');
    if(panel) panel.classList.toggle('open', addOpen);
  }
};
document.getElementById('resetBtn').onclick = clearAll;

render();

})();
</script>
